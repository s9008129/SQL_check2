registry_version: 1
target_database:
  vendor: oracle
  major_version: "11g"
  reference_release: "11g Release 2 (11.2)"
  note_zh_tw: >
    中心目前確認使用 Oracle Database 11g。正式 UI 的效能原理以 Oracle 11g 官方文件為第一順位；
    若未來確認實際為 11.1，涉及 optimizer 細節的 evidence 應再對 11gR1 文件逐條複核。

evidence:
  - id: ORACLE11G_TRANSFORMED_COLUMN
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database Performance Tuning Guide 11g Release 2
    source_section: Avoid Transformed Columns in the WHERE Clause
    source_url: https://docs.oracle.com/cd/E11882_01/server.112/e41573/sql_overview.htm
    claim_zh_tw: >
      如果先把欄位用函數加工後再比對，Oracle 可能比較難直接利用原本的索引。
      直接用原始欄位做條件，通常比較有利於資料庫選擇合適的查找方式。
    caveat_zh_tw: >
      這代表「有改善機會」，不是保證一定變快。實際是否使用索引，仍要看正式資料庫的索引設定
      與 F10 Explain Plan。
    strength: strong

  - id: ORACLE11G_PREFIX_LIKE_RANGE_SCAN
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database Performance Tuning Guide 11g Release 2
    source_section: When the Optimizer Uses Index Range Scans
    source_url: https://docs.oracle.com/cd/E25178_01/server.1111/e16638/optimops.htm
    claim_zh_tw: >
      像 'ABC%' 這種「從欄位開頭開始比對」的 LIKE，如果欄位有合適索引，
      Oracle 有機會先用索引縮小要查找的資料範圍，而不是從大量資料中逐筆尋找。
    caveat_zh_tw: >
      這只是代表索引利用的機會比較好，不代表一定會走索引或一定比較快。
      實際情況請以正式資料庫的 F10 Explain Plan 確認。
    strength: strong

  - id: ORACLE11G_LEADING_WILDCARD_RANGE_LIMIT
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database Performance Tuning Guide 11g Release 2
    source_section: When the Optimizer Uses Index Range Scans
    source_url: https://docs.oracle.com/cd/E25178_01/server.1111/e16638/optimops.htm
    claim_zh_tw: >
      如果 LIKE 一開始就是 % 或 _，Oracle 通常無法先用固定開頭快速縮小索引搜尋範圍。
      所以不能只因為改成 LIKE，就直接說這支 SQL 的索引使用一定會變好。
    caveat_zh_tw: >
      這也不代表查詢一定很慢；資料庫仍可能有其他索引或查找方式。
      是否改善，仍要看正式資料庫的 F10 Explain Plan。
    strength: conditional

  - id: ORACLE11G_SUBQUERY_UNNESTING
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database SQL Language Reference 11g Release 2
    source_section: Unnesting of Nested Subqueries
    source_url: https://docs.oracle.com/html/E26088_01/queries008.htm
    claim_zh_tw: >
      如果同一張表的相關子查詢重複出現，Oracle 可能需要反覆處理相似的工作。
      把需要的最新資料先集中算好，再和主查詢 JOIN，有機會減少重複處理。
      但像 MAX 這類彙總條件，Oracle 不一定會自動幫你改成更省事的寫法。
    caveat_zh_tw: >
      這表示「值得評估」，但還不能直接改。要先確認最新日期／時間是否可能同時有多筆資料，
      否則改成 ROW_NUMBER()=1 可能會讓查詢結果變少。
    strength: conditional

  - id: ORACLE11G_VISIT_DATA_FEWER_TIMES
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database Performance Tuning Guide 11g Release 2
    source_section: Visiting Data as Few Times as Possible
    source_url: https://docs.oracle.com/cd/E11882_01/server.112/e41573/sql_overview.htm
    claim_zh_tw: >
      如果同一批資料被重複讀取很多次，可以評估把資料一次取出後集中計算，
      減少重複讀取同一來源的工作量。
    caveat_zh_tw: >
      但 UNION／UNION ALL 可能本來就是業務上需要的結果。SQLCheck 只會指出「有重複讀取的改善空間」，
      在不能證明結果相同前，不會自動合併。
    strength: conditional

  - id: ORACLE11G_DISTINCT_DUPLICATE_ELIMINATION
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database Performance Tuning Guide 11g Release 2
    source_section: Using EXPLAIN PLAN — SORT UNIQUE
    source_url: https://docs.oracle.com/cd/E11882_01/server.112/e41573/ex_plan.htm
    claim_zh_tw: >
      Oracle 官方文件把 SORT UNIQUE 說明為「去除重複資料」的處理；DISTINCT 的目的
      也是只保留重複結果中的一份。因此，看到 DISTINCT 時可以先確認這個去重是否真的
      是業務需要，避免做了不必要的重複資料整理。
    caveat_zh_tw: >
      這不代表每一支 DISTINCT 都一定慢，也不代表可以直接移除。若 JOIN 本來就可能
      產生重複資料，拿掉 DISTINCT 會改變查詢結果；是否可移除必須先確認業務語意。
    strength: conditional

  - id: ORACLE11G_IMPLICIT_CONVERSION
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database SQL Language Reference 11g Release 2
    source_section: Datatype Comparison Rules
    source_url: https://docs.oracle.com/html/E26088_01/sql_elements002.htm
    claim_zh_tw: >
      如果比較兩邊的資料型態不同，Oracle 可能要先幫其中一邊做轉換。
      若轉換剛好發生在欄位上，除了多一道處理，也可能影響原本索引的使用機會。
    caveat_zh_tw: >
      SQLCheck 目前看不到正式資料庫的欄位型態，因此不能只看 SQL 文字就認定一定發生了哪一種轉換。
      這項目前只作為提醒，不會直接判定。
    strength: strong

  - id: ORACLE11G_IN_LIST_LIMIT
    source_type: oracle_official
    source_label: Oracle Database 11g 官方文件
    source_document: Oracle Database SQL Language Reference 11g Release 2
    source_section: IN Condition
    source_url: https://docs.oracle.com/html/E10592_02/conditions013.htm
    claim_zh_tw: >
      Oracle 11g 的單一 IN 清單最多可放 1000 個值。
      所以 SQLCheck 只有在數量沒有超過這個上限時，才會把同一欄位的一連串 OR 安全整理成 IN。
    caveat_zh_tw: >
      這項依據主要是在確保改寫後仍能在 Oracle 11g 執行，不代表 OR 改成 IN 就一定會變快。
    strength: strong
