name: Manual OpenRouter E2E

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "測試範圍：smoke 約 12 個 live cases；full 約 59 次 live analyze"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

permissions:
  contents: read

concurrency:
  group: openrouter-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SQLCHECK_LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      OPENROUTER_MODEL: "google/gemma-4-31b-it"
      SQLCHECK_ARCHIVE_ENABLED: "false"
      RUN_ROOT: data/openrouter_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/logs" "$RUN_ROOT/evidence"

      - name: Verify cloud credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::GitHub secret OPENROUTER_API_KEY is unavailable."
            exit 20
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Backend regression
        working-directory: backend
        env:
          SQLCHECK_LLM_PROVIDER: ollama
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 pytest -p no:cacheprovider -q             2>&1 | tee "../$RUN_ROOT/logs/backend_pytest.txt"
          uv run --frozen --python 3.12 ruff check .             2>&1 | tee "../$RUN_ROOT/logs/ruff.txt"

      - name: OpenRouter preflight
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --python 3.12 python - <<'PY'             > "../$RUN_ROOT/logs/provider_preflight.txt" 2>&1
          import asyncio
          from app.settings import get_settings
          from app.services import llm_provider

          s = get_settings().llm
          print(f"provider={s.provider}")
          print(f"base_url={s.base_url}")
          print(f"model={s.model}")
          print(f"api_key_present={bool(s.api_key)}")
          available = asyncio.run(llm_provider.check_available(s))
          print(f"provider_available={available}")
          if (
              s.provider != "openrouter"
              or s.base_url != "https://openrouter.ai/api/v1"
              or s.model != "google/gemma-4-31b-it"
              or not s.api_key
              or not available
          ):
              raise SystemExit("OpenRouter preflight failed")
          PY

      - name: Live golden smoke
        if: ${{ inputs.suite == 'smoke' }}
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 python tests/golden/run_golden.py -v             2>&1 | tee "../$RUN_ROOT/logs/live_golden.txt"
          cat > "../$RUN_ROOT/evidence/REPORT.md" <<'EOF'
          # SQLCheck OpenRouter E2E — Smoke

          - Scope: OpenRouter / google/gemma-4-31b-it
          - Suite: existing live golden cases
          - Browser / Native Print: not part of this cloud model/API check
          - Result: see live_golden.txt; workflow succeeds only when the golden runner exits successfully
          EOF

      - name: Full OpenRouter model/API E2E
        if: ${{ inputs.suite == 'full' }}
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12             python ../.github/e2e/live_cloud_e2e.py --out "../$RUN_ROOT/evidence"             2>&1 | tee "../$RUN_ROOT/logs/live_cloud_full.txt"

      - name: Scan evidence for credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'Authorization:[[:space:]]*Bearer|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}'             "$RUN_ROOT" --exclude='secret_scan.txt' > "$RUN_ROOT/secret_scan.txt"; then
            echo "::error::Potential credential material detected in evidence."
            exit 31
          else
            echo "NO_CREDENTIAL_PATTERN_HITS" > "$RUN_ROOT/secret_scan.txt"
          fi
          {
            echo "sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "suite=${{ inputs.suite }}"
          } > "$RUN_ROOT/run_info.txt"
          find "$RUN_ROOT" -type f -printf '%P\t%s bytes\n' | sort > "$RUN_ROOT/manifest.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openrouter-e2e-${{ inputs.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_ROOT }}
          if-no-files-found: error
          retention-days: 14
