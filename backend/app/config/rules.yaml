# SQLCheck 2.0 規則與改善優先指數設定（PRD §13、§16）。
#
# 本檔案是唯一決定「哪些規則存在、BLOCK/NOTICE 分類、改善優先指數怎麼算」的地方；
# rule_engine.py / improvement_score.py 只讀取本檔案，不得寫死規則邏輯的業務數字。
#
# 規則狀態語意（PRD §13.2）：PASS 符合 / NOTICE 提醒 / BLOCK 不符合 / REVIEW 請確認 / N/A 不適用。
# 只有 type: block 的規則會影響「中心規範」總判定；type: notice 永遍不影響總判定。

model_version: 1

rules:
  - id: R001
    name: COST
    type: block
    enabled: true
    threshold: 100000

  - id: R002
    name: WHERE 查詢條件
    type: block
    enabled: true
    # UPDATE/DELETE 的 JOIN ON 條件是否可視為等同 WHERE，業務未定案，預設不接受。
    accept_join_on: false
    # SELECT 專用：沒有寫 WHERE 關鍵字時，是否仍可能有「實質限制條件」（JOIN ON
    # 含常數、以 JOIN 鍵值連接、或限制條件寫在子查詢／WITH 內），依 sql_parser.py
    # 的 restriction_kind 分類決定判定結果（2026-09-16 業務決定：貼近實務用法，
    # 不因死板的 WHERE 關鍵字檢查誤判「有連接／限制意圖」的查詢）。
    # 可選值：pass（符合中心規範，僅提示說明）／review（請人工確認）／block（維持不符合）。
    restriction_verdicts:
      source_where: pass       # 限制條件寫在子查詢或 WITH 內
      join_on_constant: pass   # INNER JOIN 的 ON 含常數條件，實質限縮結果
      join_on_outer_constant: pass  # LEFT/RIGHT/FULL JOIN 的 ON 含常數，僅限縮該側資料表
      join_on_only: pass       # 僅以 JOIN 鍵值連接，無其他限制條件

  - id: R003
    name: Parallel Hint
    type: block
    enabled: true

  - id: R004
    name: LIKE 前置萬用字元
    type: notice
    enabled: true

  - id: R005
    name: 條件欄位使用函數
    type: notice
    enabled: true

  - id: R006
    name: OR 條件
    type: notice
    enabled: true

  - id: R007
    name: 重要資料表
    type: notice
    enabled: true

  - id: R008
    name: 重要資料表禁止操作
    type: block
    enabled: true

# ---------------------------------------------------------------------------
# 改善優先指數編製模型（PRD §16.3，由系統設計；業務定案前標示 provisional）。
#
# 公式（improvement_score.py 實作）：
#   1. 每一段 SQL（statement）分別計算 F_i（規則發現分）與 S_i（結構複雜度分）
#   2. base = max_i(F_i + S_i)  — 多段 SQL 取「最需要優先處理的那一段」
#   3. C = 依原始 COST 與門檻比例查表（全案件只有一個 COST，不分段）
#   4. score = clamp(0, 100, base + C)
#   5. 若任一段出現 BLOCK 等級 finding，score = max(score, block_floor)
#
# 2026-09-17 使用者決策：指數必須完全由「確定性事實」決定，不得再有任何 AI 分量。
# 模型看不到 Oracle execution plan、真實 index、statistics、cardinality 或實際執行
# 時間，它自己標的 impact（low/medium/high）因此不具備「效能影響高低」的證據力：
# 只保留在 AI 建議卡上供人工參考，永不回灌正式分數。
# 同樣的 SQL + COST + 本檔設定，不論 AI 是否可用、建議幾條、impact 標示為何，
# 都必須得到完全相同的指數（PRD §16.1「不讓 AI 自由打分」）。
# ---------------------------------------------------------------------------
improvement_score:
  provisional: true
  max_score: 100
  levels:
    good:
      max: 59
      label: 目前良好
      color: green
    improve:
      min: 60
      max: 79
      label: 建議改善
      color: yellow
    priority:
      min: 80
      label: 優先改善
      color: red

  # 任一段 SQL 出現 BLOCK 等級 finding 時的分數下限（不符合規範者必為「優先改善」）。
  block_floor: 80

  # F：規則發現分（0–70）。同一 rule_id 在同一段 SQL 內重複命中時，依出現順序遞減權重。
  rule_findings:
    max: 70
    repeat_decay: [1.0, 0.5, 0.25]
    weights:
      missing_where: 35
      cost_over_threshold: 35
      parallel_hint: 30
      forbidden_operation: 35
      function_on_condition: 30
      leading_wildcard_like: 25
      important_table_notice: 20
      or_condition: 15

  # S：結構複雜度分（0–15）。反映「即使沒有觸發任何規則，寫法本身有多複雜」。
  structure:
    max: 15
    many_tables_threshold: 4
    subquery_depth_threshold: 2
    weights:
      many_tables: 4
      cartesian_join: 6
      deep_subquery: 3
      select_star: 2
      distinct_or_union: 3
      not_in_subquery: 2

  # C：COST 接近門檻分（0–15）。ratio = 使用者輸入的原始 COST / R001 門檻。
  cost_ratio:
    max: 15
    bands:
      - max_ratio: 0.25
        score: 0
      - max_ratio: 0.50
        score: 5
      - max_ratio: 0.75
        score: 10
      - max_ratio: 1.00
        score: 14
      - max_ratio: null
        score: 15
