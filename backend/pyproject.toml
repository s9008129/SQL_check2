[project]
name = "sqlcheck2-backend"
version = "0.1.0"
description = "SQLCheck 2.0 backend: deterministic SQL rule engine + Ollama/Gemma advisory service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "sqlglot==30.18.0",
  "pyyaml==6.0.3",
  "python-docx==1.2.0",
  "pypdf==6.18.1",
  "charset-normalizer==3.5.1",
  "python-multipart==0.0.32",
  "cryptography==50.0.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.7",
  "respx==0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
