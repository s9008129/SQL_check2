name: Temporary Round2 Gemma Business Acceptance

on:
  push:
    branches:
      - feature/evidence-bound-advice-hardening

permissions:
  contents: read

concurrency:
  group: round2-business-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SQLCHECK_LLM_PROVIDER: openrouter
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      OPENROUTER_MODEL: "google/gemma-4-31b-it"
      SQLCHECK_ARCHIVE_ENABLED: "false"
      RUN_ROOT: data/round2_acceptance_${{ github.run_id }}_${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/logs" "$RUN_ROOT/api" "$RUN_ROOT/ui"

      - name: Verify OpenRouter secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          echo "OPENROUTER_API_KEY_PRESENT=true" > "$RUN_ROOT/logs/credential_check.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Backend regression and Ruff
        working-directory: backend
        env:
          SQLCHECK_LLM_PROVIDER: ollama
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 pytest -p no:cacheprovider -q 2>&1 | tee "../$RUN_ROOT/logs/backend_pytest.txt"
          uv run --frozen --python 3.12 ruff check . 2>&1 | tee "../$RUN_ROOT/logs/ruff.txt"

      - name: Frontend regression and build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee "../$RUN_ROOT/logs/npm_ci.txt"
          npm test -- --run 2>&1 | tee "../$RUN_ROOT/logs/frontend_tests.txt"
          npm run build 2>&1 | tee "../$RUN_ROOT/logs/frontend_build.txt"

      - name: Stage built frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf backend/static
          mkdir -p backend/static
          cp -R frontend/dist/. backend/static/
          test -f backend/static/index.html

      - name: Install Chromium
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --disable-pip-version-check "playwright==1.55.0" 2>&1 | tee "$RUN_ROOT/logs/playwright_pip.txt"
          python -m playwright install --with-deps chromium 2>&1 | tee "$RUN_ROOT/logs/playwright_install.txt"

      - name: Start SQLCheck with OpenRouter
        shell: bash
        run: |
          set -euo pipefail
          (
            cd backend
            uv run --frozen --python 3.12 uvicorn app.main:app --host 127.0.0.1 --port 8000               > "../$RUN_ROOT/logs/server.log" 2>&1 &
            echo $! > "../$RUN_ROOT/logs/server.pid"
          )
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health > "$RUN_ROOT/logs/health.json"; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/ > "$RUN_ROOT/logs/index.html"
          grep -q '<div id="root"></div>' "$RUN_ROOT/logs/index.html"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUN_ROOT"]) / "logs" / "health.json"
          data = json.loads(p.read_text())
          print(data)
          if data.get("status") != "ok" or data.get("ai_available") is not True:
              raise SystemExit("OpenRouter health check failed")
          PY

      - name: Run 10 new live SQL cases plus reliability repeats
        shell: bash
        run: |
          set +e
          (
            cd backend
            uv run --frozen --python 3.12 python ../.github/e2e/round2_business_acceptance.py               --out "../$RUN_ROOT/api"
          ) 2>&1 | tee "$RUN_ROOT/logs/round2_api.txt"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUN_ROOT/logs/api_rc.txt"
          exit 0

      - name: Run 1920x1080 live dashboard acceptance
        shell: bash
        run: |
          set +e
          python .github/e2e/round2_business_acceptance_ui.py             --cases "$RUN_ROOT/api/cases.json"             --out "$RUN_ROOT/ui"             2>&1 | tee "$RUN_ROOT/logs/round2_ui.txt"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$RUN_ROOT/logs/ui_rc.txt"
          exit 0

      - name: Record metadata and scan evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "provider=openrouter"
            echo "model=google/gemma-4-31b-it"
            echo "viewport=1920x1080"
            echo "suite=round2-10-new-cases"
          } > "$RUN_ROOT/run_info.txt"

          if grep -R -n -E 'Authorization:[[:space:]]*Bearer|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}'             "$RUN_ROOT" --exclude='secret_scan.txt' > "$RUN_ROOT/secret_scan.txt"; then
            echo "::error::Potential credential material detected in evidence."
            exit 31
          else
            echo "NO_CREDENTIAL_PATTERN_HITS" > "$RUN_ROOT/secret_scan.txt"
          fi
          find "$RUN_ROOT" -type f -printf '%P\\t%s bytes\\n' | sort > "$RUN_ROOT/manifest.txt"

      - name: Upload round-2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round2-gemma-business-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUN_ROOT }}
          if-no-files-found: error
          retention-days: 14

      - name: Final acceptance gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          api_rc="$(cat "$RUN_ROOT/logs/api_rc.txt" 2>/dev/null || echo 99)"
          ui_rc="$(cat "$RUN_ROOT/logs/ui_rc.txt" 2>/dev/null || echo 99)"
          echo "api_rc=$api_rc ui_rc=$ui_rc"
          if [ "$api_rc" -ne 0 ] || [ "$ui_rc" -ne 0 ]; then
            exit 2
          fi
