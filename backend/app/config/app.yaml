# SQLCheck 2.0 應用程式設定（上傳限制、Ollama 連線、AI 守門清單）。
# 環境變數（見 .env.example）永遠可覆寫本檔案列出的 *_env 對應項目。

app:
  name: "SQLCheck AI"
  title: "SQL 智慧效能檢核與改善助手"

upload:
  max_file_mb: 10
  max_extracted_chars: 300000
  allowed_extensions:
    - .sql
    - .txt
    - .md
    - .markdown
    - .csv
    - .docx
    - .pdf
  # DOCX 屬於 zip 容器；解壓炸彈防護：拒絕解壓後總量超過此上限，或壓縮比超過此倍數的檔案。
  docx_max_uncompressed_mb: 80
  docx_max_compression_ratio: 100

ollama:
  base_url_env: OLLAMA_BASE_URL
  base_url_default: "http://host.docker.internal:11434"
  model_env: OLLAMA_MODEL
  model_default: "gemma4:31b"
  timeout_seconds_env: OLLAMA_TIMEOUT_SECONDS
  # 2026-09-16 由 120 調高為 180：31B 模型在 num_predict 提高到 3072 後，最長回覆
  # （中文 summary + 3 條建議 + SQL 改寫）實測需要更多時間，120 秒偏緊。
  timeout_seconds_default: 180
  num_ctx_env: OLLAMA_NUM_CTX
  # 2026-09-17 由 8192 改 16384：實測 system prompt 約 5,700 token，加上完整
  # num_predict 3072 已超過 8192；正式主機 gemma4:31b 以 16384 可正常執行。
  # ai_service 只會在 num_ctx_default 的 2 倍、4 倍…（≤ num_ctx_max）之間切換，
  # 因為每個不同的 num_ctx 值都會讓 Ollama 重新載入模型。
  num_ctx_default: 16384
  # 2026-09-17 新增：一份三層巢狀、含大量中文別名的正式 SQL（約 6,000 字）加上約
  # 4,000 token 的 system prompt 超過 8192，Ollama 會「靜默截斷 prompt」
  # （log 可見 prompt_eval_count 恰等於 num_ctx），模型失去系統指令後改用英文回答、
  # 捏造資料表名稱。ai_service 現在依每次 prompt 長度估算需要的 num_ctx，
  # 在 num_ctx_default 與 num_ctx_max 之間自動放大；若仍不足則降級為「暫時無法
  # 使用」而不是顯示幻覺。num_ctx 越大 KV cache 越吃 VRAM，正式主機若回應明顯變慢
  # 可調低此上限。
  num_ctx_max_env: OLLAMA_NUM_CTX_MAX
  num_ctx_max_default: 32768
  # 2026-09-16 由 1024 調高為 3072：實測（正式主機 E2E）確認 1024 對「中文
  # summary + 最多 3 條建議（各含 explanation/example）+ 完整 SQL 改寫」經常不夠，
  # 導致輸出被截斷成無效 JSON、觸發重試、最終降級為「暫時無法使用」。若正式主機
  # VRAM 吃緊導致回應變慢，可視情況調低，但務必同時檢查 log 中的
  # `done_reason=length` 是否又開始出現。
  num_predict: 3072
  temperature: 0.2
  keep_alive: "30m"
  max_retries_on_invalid_json: 1
  # 2026-09-17 新增：關閉 Gemma4 的「思考模式」。實測（正式主機直接打 Ollama）確認
  # 預設開啟思考時，含 OR 條件的簡單查詢會把 3072 個 num_predict 全部耗在內部推理
  # （抓到 8,431 字的 thinking 內容），content 完全空白、done_reason=length，最終
  # 降級成「暫時無法使用」；關閉後同一查詢 14 秒完成、輸出完整 JSON。結構化 JSON
  # 輸出任務不需要思考模式，這也讓每次回應快 3–5 倍。可用環境變數 OLLAMA_THINK=true
  # 重新開啟（例如換成不支援 think 參數的模型時設為 true 以外的值不會有影響）。
  think_env: OLLAMA_THINK
  think_default: false

# Pattern Catalog → Gemma compact context（2026-09-18）。
# 只允許 Pattern Selector 的 exact match；family_signal / OUT_OF_SCOPE 永不注入。
# 保留開關是為了正式主機 A/B 或快速回復，不需要改程式碼。
knowledge_context:
  # 正式機 A/B／緊急回復只需設環境變數 false，不必改 catalog 或 rollback commit。
  enabled_env: SQLCHECK_KNOWLEDGE_CONTEXT_ENABLED
  enabled: true
  max_patterns: 4
  max_total_chars: 1800

# 建議寫法守門條件（PRD §17.4、§25）。
ai_gate:
  # candidate_allowed：單一段、SELECT、parser 成功解析、且不含下列任何複雜度旗標時
  # 才允許 AI 給建議寫法。
  #
  # 2026-09-17 新增「長度」守門：完整改寫要把整段 SQL 再輸出一次，估算
  # sql_tokens × rewrite_token_ratio + rewrite_reply_overhead_tokens（summary 與最多
  # 3 條建議的固定開銷）若超過 ollama.num_predict，就不允許改寫（decline_code
  # too_long_for_rewrite），只提供方向與片段。正式主機實測：約 6,000 字的三層巢狀
  # SQL 讓模型嘗試改寫時撞到 3072 token 上限，JSON 被截斷、整份回覆作廢。
  rewrite_token_ratio: 1.2
  rewrite_reply_overhead_tokens: 900
  #
  # 2026-09-16 業務決定移除 outer_join / group_by_aggregate / distinct：
  # 開發機重現使用者昨天用 6 份真實稅務 SQL 測試的結果，發現這 3 個旗標涵蓋了
  # 「幾乎所有日常業務查詢」（LEFT JOIN 多表關聯、GROUP BY 彙總、DISTINCT），
  # 導致 candidate_allowed 對每一份測試 SQL 都是 false——AI 從未被允許改寫，
  # 使用者看到的「一律不提供建議寫法」其實是這個守門造成的，不是模型過度保守。
  # 放寬後改由 ai_service.py 的 `structural_signature` 比對（相同 JOIN 種類與
  # 順序、GROUP BY、DISTINCT、彙總函數、欄位數）在建議寫法送回前做結構複核，
  # 取代「乾脆整類禁止」的做法。仍保留禁止的 4 類（集合運算、視窗函數、
  # CONNECT BY、相關子查詢、ROWNUM）是因為這些寫法的等價改寫語意風險較高，
  # 目前的結構複核不足以驗證。
  candidate_forbidden_complexity_flags:
    - window_function
    - connect_by
    - set_operation
    - rownum
    - correlated_subquery
# AI 回覆的後處理守門清單（PRD §17.4、§22、§23、§56）。
ai_guard:
  # 命中即整條建議移除（禁止 AI 宣稱資料庫實際行為，或捏造改善後 COST）。
  forbidden_phrases:
    - "Full Table Scan"
    - "full table scan"
    - "全表掃描"
    - "全資料表掃描"
    - "索引失效"
    - "已使用索引"
    - "未使用索引"
    - "已避免全表掃描"
    - "使用了索引"
    - "沒有使用索引"
    - "改善後 COST"
    - "改善後COST"
    - "Execution Plan"
    - "執行計畫顯示"
    - "已驗證"
    - "已測試"
    - "實測"
    - "高風險"
    - "嚴重問題"
    - "錯誤寫法"
  # 詞彙替換（PRD §22）：只套用在 AI 的說明文字欄位（summary / advice 標題與說明 /
  # suggested_sql.reason），不套用在 SQL 程式碼欄位（sql / example）。
  vocabulary_replacements:
    數據庫: 資料庫
    数据库: 資料庫
    字段: 欄位
    优化SQL: 改善 SQL
    優化SQL: 改善 SQL
    优化: 改善
    優化: 改善
    数据: 資料
    候選SQL: 建議寫法
    候選 SQL: 建議寫法

# 送給 AI 前的 SQL 遮罩規則（backend/app/services/masking.py，PRD §17.4、§20）。
masking:
  # 2026-09-16 新增：字串常數只有在「長度 <= 此值，且僅含 ASCII 英數字／% ／ _」
  # 時才保留原文不遮罩（例如 '114%'、'2'、'H'、'55R' 這類稅務代碼／年度／萬用字元）。
  # 背景：實測發現舊規則把所有字串常數一律遮罩，導致 AI 看不到
  # `APPR_DATE LIKE '114%'` 的實際內容，完全無法判斷這是後置萬用字元的前綴比對。
  # 目前 Runtime 不會把這類 LIKE 自動改成日期／文字範圍，因為排序規則與資料型態可能影響
  # 等價性；保留短代碼只是為了讓模型能正確描述既有 SQL 寫法。任何非 ASCII
  # 字元（例如中文姓名）或超過此長度的字串（日期、身分證、地址代碼等可能個資）
  # 一律仍遮罩，不受此設定影響。
  keep_short_ascii_literal_max_len: 4

# 去識別化 SQL 蒐集檔（backend/app/services/sql_archive.py）。
# 2026-09-16 使用者決定新增：蒐集所有送出檢核的 SQL（去識別化後），以利後續
# 交給 AI 做離線分析、統計、優化參考。這是 PRD §6.3「不得永久儲存原始 SQL／
# 申請單號／COST」的明確例外——蒐集檔只存去識別化後的 SQL 與規則結果，不存
# 申請單號、原始 SQL 常數值、附件檔名或任何使用者/IP 資訊。
archive:
  enabled: true
  enabled_env: SQLCHECK_ARCHIVE_ENABLED
  dir_env: SQLCHECK_ARCHIVE_DIR
  dir_default: "/data/sql_archive"
