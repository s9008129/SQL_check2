# SQLCheck AI 大型語言模型連線設定。
#
# 核心原則：
# 1. 程式邏輯只看「目前啟用哪個 provider」，不把 Ollama / Gemini 寫死在 ai_service。
# 2. API Key 永遠只從環境變數讀取，不寫進 YAML / Git。
# 3. 正式機預設使用 Ollama + Gemma 4 31B；Mac 優先透過 Ollama Cloud API 呼叫
#    gemma4:31b，讓 provider / API shape / 模型名稱都直接對齊正式機。
# 4. Gemini adapter 保留為備援，不再作為 Mac 預設測試路徑。
# 5. 雲端 parity 驗證只允許 synthetic / 已去識別化 SQL，不可直接送 production 原始 SQL。
#
# 切換方式：
#   SQLCHECK_LLM_PROVIDER=ollama        # 正式機 / 地端
#   SQLCHECK_LLM_PROVIDER=ollama_cloud  # Mac 開發 / Ollama Cloud
#   SQLCHECK_LLM_PROVIDER=gemini        # 備援雲端 provider

active_provider_env: SQLCHECK_LLM_PROVIDER
active_provider_default: ollama

providers:
  ollama:
    type: ollama
    remote: false
    base_url_env: OLLAMA_BASE_URL
    base_url_default: "http://host.docker.internal:11434"
    model_env: OLLAMA_MODEL
    model_default: "gemma4:31b"
    timeout_seconds_env: OLLAMA_TIMEOUT_SECONDS
    timeout_seconds_default: 180
    max_output_tokens_env: OLLAMA_NUM_PREDICT
    max_output_tokens_default: 3072
    context_window_env: OLLAMA_NUM_CTX
    context_window_default: 16384
    context_window_max_env: OLLAMA_NUM_CTX_MAX
    context_window_max_default: 32768
    temperature_default: 0.2
    top_p_env: OLLAMA_TOP_P
    top_p_default: 0.95
    top_k_env: OLLAMA_TOP_K
    top_k_default: 64
    keep_alive: "30m"
    max_retries_on_invalid_json: 1
    think_env: OLLAMA_THINK
    think_default: false
    allow_short_ascii_literals: true

  ollama_cloud:
    type: ollama
    remote: true
    base_url_env: OLLAMA_CLOUD_BASE_URL
    base_url_default: "https://ollama.com"
    model_env: OLLAMA_CLOUD_MODEL
    model_default: "gemma4:31b"
    api_key_env: OLLAMA_API_KEY
    timeout_seconds_env: OLLAMA_CLOUD_TIMEOUT_SECONDS
    timeout_seconds_default: 180
    max_output_tokens_env: OLLAMA_CLOUD_NUM_PREDICT
    max_output_tokens_default: 3072
    context_window_env: OLLAMA_CLOUD_NUM_CTX
    context_window_default: 16384
    context_window_max_env: OLLAMA_CLOUD_NUM_CTX_MAX
    context_window_max_default: 32768
    temperature_env: OLLAMA_CLOUD_TEMPERATURE
    temperature_default: 0.2
    top_p_env: OLLAMA_CLOUD_TOP_P
    top_p_default: 0.95
    top_k_env: OLLAMA_CLOUD_TOP_K
    top_k_default: 64
    keep_alive: null
    max_retries_on_invalid_json: 1
    think_env: OLLAMA_CLOUD_THINK
    think_default: false
    allow_short_ascii_literals: true

  gemini:
    type: gemini
    remote: true
    base_url_env: GEMINI_BASE_URL
    base_url_default: "https://generativelanguage.googleapis.com/v1beta"
    model_env: GEMINI_MODEL
    # Gemini API 是「傳輸服務」；實際模型固定比照正式機 Gemma 4 31B instruction-tuned。
    # Google Gemini API 的官方 model id 為 gemma-4-31b-it。
    model_default: "gemma-4-31b-it"
    api_key_env: GEMINI_API_KEY
    timeout_seconds_env: GEMINI_TIMEOUT_SECONDS
    timeout_seconds_default: 180
    max_output_tokens_env: GEMINI_MAX_OUTPUT_TOKENS
    max_output_tokens_default: 3072
    # Hosted Gemma 實際可用更長 context，但 SQLCheck 的 parity profile 保留與地端相同的
    # 16384 / 32768 長度級距，避免本地 gate 與雲端 gate 因設定不同而產生測試偏差。
    # generateContent 本身不會收到 Ollama 的 num_ctx；這兩個值用於 SQLCheck 自己的估算。
    context_window_default: 16384
    context_window_max_default: 32768
    # 與正式 Ollama profile 對齊。Ollama 官方 gemma4:31b 的模型預設 top_p=0.95 / top_k=64；
    # 專案另外把 temperature 固定為 0.2，因此雲端 parity 也明確送出相同值。
    temperature_env: GEMINI_TEMPERATURE
    temperature_default: 0.2
    top_p_env: GEMINI_TOP_P
    top_p_default: 0.95
    top_k_env: GEMINI_TOP_K
    top_k_default: 64
    # 地端 OLLAMA_THINK=false；Gemma 4 API 僅支援 high / minimal，因此 parity 使用 minimal。
    thinking_level_env: GEMINI_THINKING_LEVEL
    thinking_level_default: minimal
    keep_alive: null
    max_retries_on_invalid_json: 1
    think_default: false
    # 與地端 mask 規則一致，才能做 apples-to-apples 模型比較。
    # 因此雲端 parity 測試只能使用 synthetic / 已去識別化 SQL。
    allow_short_ascii_literals: true
