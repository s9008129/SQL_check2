name: Post-PR21 Cloud E2E

on:
  push:
    branches:
      - test/cloud-e2e-smoke-20260920
    paths:
      - ".github/e2e/cloud_post_pr21.py"
      - ".github/workflows/post-pr21-cloud-e2e.yml"

permissions:
  contents: read

concurrency:
  group: post-pr21-cloud-e2e-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-model-api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SQLCHECK_LLM_PROVIDER: ollama_cloud
      OLLAMA_API_KEY: \${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_CLOUD_MODEL: gemma4:31b
      SQLCHECK_ARCHIVE_ENABLED: "false"
      RUN_ID: cloud_post_pr21_\${{ github.run_id }}_\${{ github.run_attempt }}
      RUN_ROOT: data/cloud_post_pr21_\${{ github.run_id }}_\${{ github.run_attempt }}
      TMPDIR: \${{ github.workspace }}/data/cloud_post_pr21_\${{ github.run_id }}_\${{ github.run_attempt }}/tmp
      TMP: \${{ github.workspace }}/data/cloud_post_pr21_\${{ github.run_id }}_\${{ github.run_attempt }}/tmp
      TEMP: \${{ github.workspace }}/data/cloud_post_pr21_\${{ github.run_id }}_\${{ github.run_attempt }}/tmp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUN_ROOT/logs" "$RUN_ROOT/tmp"
          {
            echo "workflow=Post-PR21 Cloud E2E"
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "runner_os=$RUNNER_OS"
            echo "browser_scope=excluded_by_design"
            echo "print_scope=excluded_by_design"
          } > "$RUN_ROOT/environment.txt"

      - name: Verify Ollama Cloud secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "\${OLLAMA_API_KEY:-}" ]; then
            echo "::error::GitHub secret OLLAMA_API_KEY is unavailable."
            exit 20
          fi
          echo "ollama_api_key_present=true" >> "$RUN_ROOT/environment.txt"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate cloud E2E harness syntax
        shell: bash
        run: python -m py_compile .github/e2e/cloud_post_pr21.py

      - name: Backend regression
        working-directory: backend
        shell: bash
        env:
          SQLCHECK_LLM_PROVIDER: ollama
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 pytest -p no:cacheprovider -q \
            2>&1 | tee "../$RUN_ROOT/logs/backend_pytest.txt"

      - name: Ruff
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 ruff check . \
            2>&1 | tee "../$RUN_ROOT/logs/ruff.txt"

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend regression
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm test -- --run 2>&1 | tee "../$RUN_ROOT/logs/frontend_tests.txt"

      - name: Frontend build
        working-directory: frontend
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "../$RUN_ROOT/logs/frontend_build.txt"

      - name: Ollama Cloud provider preflight
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --python 3.12 python - <<'PY' \
            > "../$RUN_ROOT/logs/provider_preflight.txt" 2>&1
          import asyncio
          from app.settings import get_settings
          from app.services import llm_provider

          settings = get_settings()
          llm = settings.llm
          print(f"provider={llm.provider}")
          print(f"provider_type={llm.provider_type}")
          print(f"remote={llm.remote}")
          print(f"base_url={llm.base_url}")
          print(f"model={llm.model}")
          print(f"api_key_present={bool(llm.api_key)}")
          print(f"temperature={llm.temperature}")
          print(f"top_p={llm.top_p}")
          print(f"top_k={llm.top_k}")
          print(f"context_window={llm.context_window}")
          print(f"max_output_tokens={llm.max_output_tokens}")
          print(f"think={llm.think}")
          available = asyncio.run(llm_provider.check_available(llm))
          print(f"provider_available={available}")
          if llm.provider != "ollama_cloud":
              raise SystemExit("provider mismatch")
          if llm.base_url != "https://ollama.com":
              raise SystemExit("base_url mismatch")
          if llm.model != "gemma4:31b":
              raise SystemExit("model mismatch")
          if not llm.api_key:
              raise SystemExit("api key missing")
          if not available:
              raise SystemExit("provider unavailable")
          PY

      - name: Run Post-PR21 live model/API E2E
        id: live_e2e
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 \
            python .github/e2e/cloud_post_pr21.py --out "$RUN_ROOT" \
            2>&1 | tee "$RUN_ROOT/logs/live_e2e_console.txt"

      - name: Record git state and manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            git status --short
          } > "$RUN_ROOT/git_state.txt"
          if grep -R -n -E 'Authorization:[[:space:]]*Bearer|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}' \
            "$RUN_ROOT" --exclude='secret_scan.txt' > "$RUN_ROOT/secret_scan.txt"; then
            echo "::error::Potential credential material detected in evidence."
            exit 31
          else
            echo "NO_CREDENTIAL_PATTERN_HITS" > "$RUN_ROOT/secret_scan.txt"
          fi
          find "$RUN_ROOT" -type f ! -path '*/tmp/*' -printf '%P\t%s bytes\n' | sort > "$RUN_ROOT/manifest.txt"

      - name: Package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUN_ROOT/tmp"
          ZIP_PATH="data/$RUN_ID.zip"
          zip -qr "$ZIP_PATH" "$RUN_ROOT"
          unzip -t "$ZIP_PATH" > "$RUN_ROOT/logs/zip_test.txt"
          sha256sum "$ZIP_PATH" > "$ZIP_PATH.sha256"

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-pr21-cloud-e2e-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: |
            data/${{ env.RUN_ID }}.zip
            data/${{ env.RUN_ID }}.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Enforce E2E verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "\${{ steps.live_e2e.outcome }}" != "success" ]; then
            echo "::error::Post-PR21 cloud model/API E2E did not meet acceptance targets. See uploaded REPORT.md and CSV evidence."
            exit 2
          fi
