name: Temporary Round2 Regression

on:
  push:
    branches:
      - fix/e2e-round2-evidence-grounding

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.5"
      - name: Backend tests and Ruff
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen --python 3.12 pytest -p no:cacheprovider -q
          uv run --frozen --python 3.12 ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests and build
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm test
          npm run build
