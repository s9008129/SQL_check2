# SQLCheck Oracle SQL Pattern Catalog — Source of Truth for optimization
# knowledge governance (SQLCheck Oracle Knowledge v1).
#
# This file is machine-readable knowledge, not free-form runtime prompt prose.
# pattern_selector.py identifies deterministic exact matches and broader family
# signals. context_adapter.py may send only a bounded set of exact,
# non-OUT_OF_SCOPE entries' static model_guidance_zh_tw to Gemma through
# <SQL_DATA>. family_signal is never injected. This context does not change
# gating/scoring/compliance/rewrite verification and is not exposed in the
# API/UI. See skills/sqlcheck-oracle-review/references/project-boundaries.md.
#
# Governance model (four classes — see
# skills/sqlcheck-oracle-review/SKILL.md for the full explanation):
#   VERIFIED_REWRITE — the rewritten form is equivalent for every input,
#     proven by backend/app/services/rewrite_rules.py WITHOUT relying on an
#     unverified precondition (column datatype, time component, collation…),
#     AND the rewritten SQL stays executable on the target Oracle version
#     (e.g. within Oracle's 1000-expression IN-list limit). Logical
#     equivalence alone is not enough.
#     A rewrite_rules.py rule existing is NOT by itself proof; runtime rules
#     must meet this same bar. Since 2026-09-18 (Runtime Correctness v1) the
#     runtime certifies exactly the Class A forms and boundaries below: the
#     TRUNC and NVL rules were removed, SUBSTR accepts only its canonical LIKE
#     form, and OR→IN is limited to 1000 values. tests/test_pattern_catalog.py
#     probes the runtime and fails if the two drift apart. This is the only
#     class Pattern Selector may expose as a proven exact match — and only for
#     the forms and boundaries the entry authorizes.
#   ADVICE_ONLY — a reasonable direction, but SQLCheck cannot prove the
#     rewritten SQL returns the same rows in every case. May be explained and
#     suggested; must never become an automatic "已驗證" rewrite.
#   INFORMATIONAL — worth a reviewer's attention; does not itself mean the
#     SQL is wrong or that performance will improve.
#   OUT_OF_SCOPE — SQLCheck has no real Oracle optimizer context (no
#     execution plan, no index metadata, no statistics, no cardinality). Can
#     be described as "requires DBA / test-environment confirmation"; must
#     never be answered by Gemma.
#
# Authority order (unchanged by this file — see project-boundaries.md):
#   正式中心規範 > rule_engine.py (Deterministic Rule Engine)
#   > rewrite_rules.py (Deterministic Rewrite Rules) > this catalog > Gemma.
#
# Field reference:
#   id                     stable, unique, upper_snake_case identifier.
#   name_zh_tw             short Traditional-Chinese label for UI/docs use.
#   category               predicate | join | subquery | set_operation |
#                          distinct | structure | table_usage | index |
#                          plan | statistics | storage.
#   classification         one of the four classes above.
#   oracle_applicable      true unless the pattern is dialect-irrelevant.
#   detection.source       the detector that identifies THIS pattern
#                          specifically — not merely a broader family it
#                          belongs to:
#                            rule_engine              -> rules.yaml rule ids
#                            rewrite_rules            -> rewrite_rules.py
#                                                        function-level rule
#                                                        names (the `rule`
#                                                        field of `Rewrite`)
#                            sql_parser_complexity_flag -> ParsedStatement.
#                                                        complexity_flags
#                            improvement_score_structure -> improvement_score
#                                                        .yaml `structure`
#                                                        weight keys
#                            prompt_heuristic_only    -> no specific
#                                                        deterministic
#                                                        detector; only the
#                                                        system prompt asks
#                                                        the model to check
#                                                        for this
#                            none                     -> no specific detector
#                                                        anywhere
#   detection.rule_ids            rule_engine.py ids that detect this pattern
#                                 specifically (source: rule_engine only).
#   detection.rewrite_rule_ids    rewrite_rules.py rule names, e.g.
#                                 ["substr_eq_to_like"] (source:
#                                 rewrite_rules only).
#   detection.complexity_flags    sql_parser.py complexity_flags values
#                                 (source: sql_parser_complexity_flag only).
#   detection.structure_keys      improvement_score.yaml `structure.weights`
#                                 keys (source: improvement_score_structure
#                                 only).
#   detection.family_signals      optional. Deterministic signals that fire
#                                 for a BROADER family containing this
#                                 pattern — e.g. R005 fires on any function on
#                                 a condition column, R006 on any OR, the
#                                 outer_join flag on LEFT/RIGHT/FULL/(+). They
#                                 are never sufficient on their own: hitting
#                                 this pattern needs an extra AST predicate
#                                 that does not exist yet. Fields: rule_ids,
#                                 complexity_flags, qualifier_zh_tw
#                                 (required, says what the signal cannot
#                                 tell apart).
#   model_guidance_zh_tw   compact, static guidance safe to inject into Gemma
#                          only when Pattern Selector has an exact match.
#                          Required for deterministic non-OUT_OF_SCOPE entries.
#                          It must not contain user SQL/literals or claims that
#                          exceed the pattern's classification.
#   rationale_zh_tw        why this classification, in plain language.
#   allowed_behavior.explain        the system/AI may describe the pattern.
#   allowed_behavior.advice         the system/AI may suggest a direction.
#   allowed_behavior.automatic_rewrite  may this pattern EVER become an
#                          automatic "已驗證" rewrite without a human
#                          confirming it first. Only ever true for
#                          VERIFIED_REWRITE, and even then the actual
#                          verification is done by rewrite_rules.py — this
#                          flag documents intent, it does not itself perform
#                          or authorize the rewrite.
#   prohibited_claims      words/claims the model must never attach to this
#                          pattern (index existence, execution plan, actual
#                          COST after rewrite, etc.) — enforced today by
#                          app.yaml's ai_guard.forbidden_phrases and the
#                          system prompt's 語氣與用詞紅線 section, independent
#                          of this file.
#   verification.required_for_rewrite  true if any rewrite claim for this
#                          pattern must be proven before being shown as
#                          "verified"/"corrected" rather than "unverified".
#   verification.mechanism  deterministic_python | none. deterministic_python
#                          means a governance-accepted proof exists, so it is
#                          only used by VERIFIED_REWRITE entries.
#   authorized_boundary    optional; the input range a VERIFIED_REWRITE is
#                          authorized for when the rewritten SQL has an Oracle
#                          limit the original does not. Fields:
#                          max_in_list_expressions (int, ≤ 1000),
#                          oracle_version, description_zh_tw. Inputs outside
#                          the boundary are not authorized, even if the
#                          runtime still derives them (record that as a
#                          runtime_gap).
#   runtime_gap            REQUIRED whenever the runtime (rewrite_rules.py)
#                          does more than this entry authorizes — i.e. it
#                          labels a fragment verified/corrected for a form
#                          governance does not certify. The catalog does not
#                          change runtime behavior; it records the gap so a
#                          separate correctness PR can close it before any
#                          downstream context adapter relies on this entry.
#                          No entry declares one as of 2026-09-18; the probes
#                          in tests/test_pattern_catalog.py require one to be
#                          added if the runtime starts certifying an
#                          uncertified form again.
#     runtime_gap.kind     unverified_precondition (equivalence needs a
#                          precondition the runtime only states as an
#                          `assumption` text, never checks) |
#                          unauthorized_accepted_form (the runtime also
#                          accepts an extra output form this entry does not
#                          authorize; listed in not_authorized_forms).
#     runtime_gap.runtime_rule  the rewrite_rules.py rule id with the gap.
#     runtime_gap.not_authorized_forms  forms the selector/context adapter must
#                          never pick automatically (required for
#                          unauthorized_accepted_form).
#     runtime_gap.description_zh_tw / required_action_zh_tw  why, and what
#                          must happen before Phase 2.
#   sources                provenance: internal (SQLCheck code/decision),
#                          external_skill (github/awesome-copilot
#                          sql-optimization) or oracle_documentation.
#
# Adding a pattern: append an entry, run
#   cd backend && uv run pytest tests/test_pattern_catalog.py -q
# A new VERIFIED_REWRITE entry additionally requires a corresponding rule in
# rewrite_rules.py with its own positive/negative/boundary tests in
# tests/test_rewrite_rules.py — this file alone never makes a rewrite
# automatic. Conversely, every rule in rewrite_rules._RULES must have exactly
# one entry here (any classification); adding a runtime rule without one
# fails tests/test_pattern_catalog.py.

catalog_version: 1

patterns:
  # ===========================================================================
  # Predicate rewrites the runtime (backend/app/services/rewrite_rules.py) has
  # handled. Each rule in `_RULES` has exactly one entry here.
  # SUBSTR_EQ_TO_LIKE (canonical LIKE only) and OR_SAME_COLUMN_TO_IN (1–1000
  # values) are the two runtime rules, and the runtime enforces both limits.
  # TRUNC_EQ_TO_RANGE and NVL_EQ_TO_OR_IS_NULL had runtime rules until
  # 2026-09-18; they were removed because equivalence cannot be proven from
  # SQL text, and both stay ADVICE_ONLY.
  # ===========================================================================
  - id: SUBSTR_EQ_TO_LIKE
    name_zh_tw: SUBSTR 定位比對改為 LIKE
    model_guidance_zh_tw: >
      系統已能以確定性規則驗證符合條件的 SUBSTR 等式改寫；只使用系統認可的 canonical LIKE 形式。
      說明時優先指出「減少欄位端函數、讓條件直接比對原始欄位」這個效能動機，不要只寫更簡潔易讀。
      若 canonical LIKE 是固定前綴，可說值得評估索引存取潛力；若前方仍有 % 或 _，不可暗示一般索引會改善。
      不要自行改變萬用字元位置，也不要改成依賴 collation 的上下界範圍。
    category: predicate
    classification: VERIFIED_REWRITE
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: rewrite_rules
      rewrite_rule_ids: [substr_eq_to_like]
      family_signals:
        rule_ids: [R005]
        qualifier_zh_tw: >
          R005 對任何「條件欄位套函數」都會命中，無法分辨是否為 SUBSTR 等於
          比對；本 pattern 的具體偵測是 rewrite_rules._rule_substr_eq。
    rationale_zh_tw: >
      本 pattern 只認可 canonical LIKE 形式：SUBSTR(col, p, n) = 'v' 等價於
      col LIKE '<p-1 個底線>v%'（len(v) = n 且 v 不含 % 或 _），因為 SUBSTR
      取出的固定長度片段等於 v 若且唯若該位置的字元恰好是 v，這與 LIKE 樣式
      的語意相同，且對 NULL 值的行為一致。系統只接受這個推導結果，不接受模型
      自創的萬用字元位置（正式案例：模型曾把 SUBSTR(MANAGE_CD,6,3)='551' 誤改
      為 LIKE '__%551%'，語意不同）。v 含單引號時，canonical 文字會把單引號
      重複成 ''，確保仍是可執行的 SQL。p=1 的上下界寫法
      col >= 'v' AND col < '<next(v)>' 依賴 collation（NLS_COMP／NLS_SORT），
      SQLCheck 看不到，因此不在認可範圍內；runtime 自 2026-09-18 起也不再
      接受這種寫法（模型寫成上下界時，片段會被系統改成 canonical LIKE，整段
      改寫則會被退回）。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: true
    prohibited_claims:
      - index_usage
      - execution_plan
      - post_rewrite_cost
    verification:
      required_for_rewrite: true
      mechanism: deterministic_python
    sources:
      - type: internal
        ref: backend/app/services/rewrite_rules.py::_rule_substr_eq
      - type: internal
        ref: Handoff.md 2026-09-17 深夜（三）
      - type: internal
        ref: backend/tests/test_rewrite_rules.py SUBSTR 段落（上下界寫法不被接受、單引號跳脫）

  - id: TRUNC_EQ_TO_RANGE
    name_zh_tw: TRUNC 日期等式改為範圍比對
    model_guidance_zh_tw: >
      已確定 TRUNC() 是條件式的直接比較端，而且包住資料欄位。只能用白話說明「欄位先做函數再比對」
      的改善方向；欄位型態與綁定值是否含時間看不到，因此不得自行產生日期範圍 SQL，也不得宣稱一定變快。
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [trunc_predicate]
      family_signals:
        rule_ids: [R005]
        qualifier_zh_tw: >
          R005 對任何「條件欄位套函數」都會命中，無法分辨是否為 TRUNC 等於
          比對。rewrite_rules.py 自 2026-09-18 起已沒有 TRUNC 專屬規則，只剩
          系統提示要求模型把這類改寫當成需要前提的 advice_only。
    rationale_zh_tw: >
      TRUNC(col) = X 與 col >= X AND col < X + 1 只有在 X 不含時分秒、且 col 是
      DATE 時才等價。若 X（綁定變數或運算式）實際帶有時間，例如當天 10:00，
      原條件因 TRUNC 結果一定是午夜而不會命中任何資料，範圍寫法卻會回傳當天
      10:00 到隔天 10:00 的資料。即使 X 是不含時間的日期常數，col 若是數值
      欄位，TRUNC 是去掉小數部分，TRUNC(n) = 0 對應 -1 < n < 1，範圍寫法卻是
      0 <= n < 1。SQLCheck 看不到綁定變數的實際值，也看不到欄位型別，只憑
      SQL 文字找不到可以證明等價的子集，因此只能提供方向並寫明前提。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - post_rewrite_cost
    verification:
      required_for_rewrite: true
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/services/rewrite_rules.py 模組說明（2026-09-18 移除 TRUNC 推導規則）
      - type: internal
        ref: backend/tests/test_rewrite_rules.py TRUNC 段落（綁定變數、運算式、可能帶時間的常數、數值欄位皆為 unverified）
      - type: internal
        ref: "PR #2 third-party review item 1 (2026-09-18)"

  - id: NVL_EQ_TO_OR_IS_NULL
    name_zh_tw: NVL 預設值比對改為明確條件
    model_guidance_zh_tw: >
      已確定 NVL() 是條件式的直接比較端，而且包住資料欄位。可提醒使用者先確認空值規則與欄位型態，
      再評估是否能直接用原始欄位比對；不得把 SELECT／SUM 等其他位置的 NVL 誤當成此 pattern，
      也不得自行輸出可直接貼上的 OR／IS NULL 改寫。
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [nvl_predicate]
      family_signals:
        rule_ids: [R005]
        qualifier_zh_tw: >
          R005 對任何「條件欄位套函數」都會命中，無法分辨是否為 NVL 等於
          比對。rewrite_rules.py 自 2026-09-18 起已沒有 NVL 專屬規則；系統提示
          的檢查項 (1) 仍要求模型檢查條件欄位上的 NVL。
    rationale_zh_tw: >
      只看 NULL 代換的邏輯時，NVL(col, 'a') = 'b' 在 a == b 時對應
      (col = 'b' OR col IS NULL)，a != b 時對應 col = 'b'；但 Oracle 的比較
      語意還受欄位資料型別影響，SQLCheck 看不到欄位型別。NVL 的 expr1 為文字
      資料時回傳 VARCHAR2，而 VARCHAR2 與文字常數比較採 nonpadded semantics；
      CHAR 欄位直接與文字常數比較則採 blank-padded semantics。因此 CHAR(3)
      欄位值 'b  ' 會讓 NVL(col,'x') = 'b' 為 false、col = 'b' 為 true，兩種
      寫法回傳的資料不同。在無法確認欄位不是 CHAR／NCHAR 之前只能提供方向。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - post_rewrite_cost
    verification:
      required_for_rewrite: true
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/services/rewrite_rules.py 模組說明（2026-09-18 移除 NVL 推導規則）
      - type: oracle_documentation
        ref: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/NVL.html
      - type: oracle_documentation
        ref: https://docs.oracle.com/en/database/oracle/oracle-database/26/sqlrf/Data-Type-Comparison-Rules.html
      - type: internal
        ref: "PR #2 third-party review item 2 (2026-09-18)"

  - id: OR_SAME_COLUMN_TO_IN
    name_zh_tw: 同欄位 OR 串接改為 IN
    model_guidance_zh_tw: >
      只有同一欄位、全部為等於比較時可改成 IN；單一 IN 最多 1000 個值。
      跨欄位 OR 或超過 1000 個值都不得當成系統確認的改寫。
    category: predicate
    classification: VERIFIED_REWRITE
    oracle_applicable: true
    evidence_refs: [ORACLE11G_IN_LIST_LIMIT]
    detection:
      source: rewrite_rules
      rewrite_rule_ids: [or_eq_to_in]
      family_signals:
        rule_ids: [R006]
        qualifier_zh_tw: >
          R006 對任何 OR 都會命中，無法分辨是同欄位還是跨欄位；本 pattern 的
          具體偵測是 rewrite_rules._rule_or_eq_to_in（全部為同一欄位的等於比較）。
    rationale_zh_tw: >
      col = a OR col = b [OR ...]（全部比較同一欄位、皆為等於比較字面值或
      bind 參數）與 col IN (a, b, ...) 邏輯上完全相同，是純粹的語法糖轉換。
      但改寫後的 SQL 還必須能在中心 Oracle 11g 執行：Oracle 11g 單一運算式的 IN 清單
      最多 1000 個 expression，原本的 OR 串沒有這個限制，所以本 pattern 只
      授權 1～1000 個值（見 authorized_boundary）；超過 1000 個值的 OR 串不能
      改成單一 IN。runtime 自 2026-09-18 起以明確的數量檢查
      （rewrite_rules.ORACLE_IN_LIST_MAX_EXPRESSIONS）只在 2～1000 個值時推導
      （1 個值本來就沒有 OR），並以非遞迴方式展開 OR 串，不再依賴 Python
      遞迴深度。不同欄位的 OR 串接不屬於本規則（見
      OR_CROSS_COLUMN_TO_UNION_ALL）。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: true
    prohibited_claims:
      - index_usage
      - execution_plan
      - post_rewrite_cost
    verification:
      required_for_rewrite: true
      mechanism: deterministic_python
    authorized_boundary:
      max_in_list_expressions: 1000
      oracle_version: "11g"
      description_zh_tw: >
        只授權改寫後 IN 清單含 1～1000 個 expression 的情況；超過 1000 個時，
        改寫後的 SQL 會超出 Oracle 11g IN 清單上限而無法執行，即使邏輯等價
        也不在授權範圍。
    sources:
      - type: internal
        ref: backend/app/services/rewrite_rules.py::_rule_or_eq_to_in
      - type: internal
        ref: backend/tests/test_rewrite_rules.py OR → IN 段落（2／10／999／1000 推導；1001／1500／3000 由數量檢查拒絕）
      - type: oracle_documentation
        ref: https://docs.oracle.com/html/E10592_02/conditions013.htm
      - type: internal
        ref: "PR #2 third-party review round 2 item 1 (2026-09-18)"

  # ===========================================================================
  # Class B — ADVICE_ONLY
  # ===========================================================================
  - id: PREDICATE_FUNCTION_GENERIC
    name_zh_tw: 條件欄位使用函數（一般情況）
    model_guidance_zh_tw: >
      已確定條件式直接對欄位做 TO_CHAR() 等轉換後再比較。只能提醒評估直接使用原始欄位型態；
      欄位型態與格式需求看不到，因此不得自行組日期範圍或其他可直接貼上的替代條件。
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [to_char_predicate]
      family_signals:
        rule_ids: [R005]
        qualifier_zh_tw: >
          R005 對任何條件欄位函數都會命中（含已有 runtime rule 的 SUBSTR
          形式），無法確認函數落在 rewrite_rules.py 的處理範圍之外；要確認
          屬於本 pattern 還需要額外的 AST 判定，目前不存在。
          系統提示的檢查項 (1) 要求模型逐項檢查條件欄位函數。
    rationale_zh_tw: >
      條件欄位套用函數（TRIM／TO_CHAR／自訂函數等未被 rewrite_rules.py 涵蓋
      的形式）通常有機會改寫成欄位本身的直接比較，但每種函數的等價改法都需
      要個別驗證語意（型別、NULL 行為、格式假設）。治理上目前只認可
      SUBSTR 等於比對改為 canonical LIKE 這一種形式為已證明（見
      SUBSTR_EQ_TO_LIKE）；TRUNC／NVL 的改寫需要 SQL 文字看不到的前提，
      runtime 自 2026-09-18 起不再推導（見 TRUNC_EQ_TO_RANGE、
      NVL_EQ_TO_OR_IS_NULL）。其餘一律只能提供方向。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_not_used
      - full_table_scan
      - execution_plan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: backend/app/config/rules.yaml R005

  - id: UPPER_CASE_FOLD_REMOVAL
    name_zh_tw: 移除 UPPER／LOWER 大小寫轉換
    model_guidance_zh_tw: >
      已確定 UPPER()／LOWER() 是條件式的直接比較端。可提醒使用者確認資料大小寫規則，
      再評估是否能直接比對原始欄位；不得假設資料本來就全部同一大小寫，也不得自行移除函數。
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [case_fold_predicate]
      family_signals:
        rule_ids: [R005]
        qualifier_zh_tw: >
          R005 對任何條件欄位函數都會命中，無法分辨是否為 UPPER／LOWER；
          系統提示的檢查項 (1) 點名 UPPER，但沒有確定性的偵測器。
    rationale_zh_tw: >
      語意陷阱：WHERE UPPER(email) = 'ABC' 直接改成 WHERE email = 'abc' 並不
      保證結果相同——實際資料中大小寫混雜時，兩種寫法比對到的資料列可能不同。
      系統沒有欄位實際值分布的資訊，無法確認移除 UPPER／LOWER 後結果是否
      不變，因此永遠只能提醒「可視資料實際大小寫慣例評估」，不可自動改寫。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_not_used
      - full_table_scan
      - actual_data_distribution
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: backend/app/prompts/sql_review_zh_tw.txt 「not_needed 前的檢查項 (1)」
      - type: internal
        ref: backend/tests/test_rewrite_rules.py::test_upper_removal_is_unverified

  - id: IMPLICIT_TYPE_CONVERSION_MIXED_QUOTING
    name_zh_tw: 同性質欄位引號用法不一致（可能隱含型別轉換）
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: prompt_heuristic_only
    rationale_zh_tw: >
      同一段 SQL 中性質相近的代碼欄位一邊加引號、一邊不加（例如
      COLL_YR = 107 但 LEVY_TP = '1'）可能代表其中一邊發生隱含型別轉換。
      系統看不到欄位實際型別，無法確認，目前只由系統提示要求模型檢查並以
      advice_only 提醒；沒有 sql_parser 層級的偵測器。Future Phase 候選：
      在 sql_parser 增加「同名模式欄位引號不一致」的結構化偵測。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - column_actual_type
      - index_usage
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/prompts/sql_review_zh_tw.txt 「隱含型別轉換」段落

  - id: NOT_IN_SUBQUERY_TO_NOT_EXISTS
    name_zh_tw: NOT IN 子查詢改為 NOT EXISTS
    model_guidance_zh_tw: >
      只提供 advice_only：NOT IN 與 NOT EXISTS 的 NULL 語意可能不同。
      未確認子查詢欄位是否可能為 NULL 前，不要產生完整自動改寫。
    category: subquery
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [not_in_subquery]
    rationale_zh_tw: >
      語意陷阱：當子查詢欄位可能為 NULL 時，NOT IN 會使整個條件不回傳任何
      資料，NOT EXISTS 則不受影響——兩者在有 NULL 時結果不同。系統無法確認
      子查詢欄位是否可能為 NULL（NOT NULL 約束資訊不在輸入範圍內），因此只能
      提醒評估，不能自動改寫；ai_service._revalidate_suggested_sql 的
      structure-class 比對也會擋下任何把 not_in_subquery 換成
      correlated_subquery 的整段改寫。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - full_table_scan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: backend/app/services/ai_service.py::_STRUCTURE_CLASS_FLAGS

  - id: IN_SUBQUERY_TO_EXISTS
    name_zh_tw: IN 子查詢改為 EXISTS
    category: subquery
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      IN／EXISTS 在多數情況下結果相同，但子查詢含 DISTINCT、集合運算或多欄位
      對應等寫法時仍可能出現差異，且哪一種寫法「較有效率」高度依賴 Oracle
      optimizer 與統計資訊（見 Class D）。系統目前沒有專屬偵測旗標，僅列為
      已知的 advice_only 候選知識，非自動偵測項目。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization

  - id: OR_CROSS_COLUMN_TO_UNION_ALL
    name_zh_tw: 跨欄位 OR 條件改為 UNION ALL
    model_guidance_zh_tw: >
      已確定偵測到同一個 OR 鏈包含不同欄位。可說明可評估拆分查詢，
      但 UNION ALL 可能產生重複列、UNION 會改變去重行為；不要直接給可採用改寫。
    category: set_operation
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [cross_column_or]
      family_signals:
        rule_ids: [R006]
        qualifier_zh_tw: >
          R006 只知道有 OR；只有 cross_column_or AST flag 才能確認這個 pattern。
          未命中 exact flag 時仍不得把一般 OR 當成跨欄位 OR。
    rationale_zh_tw: >
      語意陷阱：OR 條件若拆成 UNION（去重）或 UNION ALL（不去重）兩個查詢，
      必須先確認同一列是否可能同時符合兩邊條件——會同時符合時 UNION ALL 會
      重複列出該列，UNION 則需要額外的效能代價去重，兩者都可能改變結果筆數
      語意。系統無法從 SQL 文字判斷兩個條件在資料上是否互斥，因此只能提供
      方向，不能自動改寫。同欄位的 OR 見 OR_SAME_COLUMN_TO_IN（Class A）。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: backend/app/config/rules.yaml R006

  - id: LEFT_JOIN_TO_INNER_JOIN
    name_zh_tw: LEFT JOIN 改為 INNER JOIN
    category: join
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: none
      family_signals:
        complexity_flags: [outer_join]
        qualifier_zh_tw: >
          outer_join 對 LEFT／RIGHT／FULL JOIN 與 Oracle (+) 寫法都會命中，
          只表示有外部連接，不能分辨是否為 LEFT JOIN，更不代表可以改成
          INNER JOIN。
    rationale_zh_tw: >
      語意陷阱：只有在「副表一定有對應資料」的業務前提下，LEFT JOIN 才能
      改成 INNER JOIN 而結果不變；若副表可能無對應資料，改寫會直接刪掉那些
      主表列，是結果筆數的改變，不是效能優化。系統沒有資料完整性資訊可以
      確認這個前提，因此不得視為 generic safe rewrite；
      ai_service._revalidate_suggested_sql 的 join_sides 結構比對也會擋下
      任何把 LEFT JOIN 換成 INNER JOIN 的整段改寫。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: backend/app/services/ai_service.py::_revalidate_suggested_sql join_sides 比對

  - id: CORRELATED_SUBQUERY_TO_JOIN_OR_WINDOW
    name_zh_tw: 相關子查詢改為 JOIN 或視窗函數
    model_guidance_zh_tw: >
      只提供 advice_only：相關子查詢改成 JOIN／視窗函數可能改變重複列、聚合或結果語意。
      可提醒評估，但不要自動改寫。
    category: subquery
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [correlated_subquery]
    rationale_zh_tw: >
      語意陷阱：相關子查詢改寫成 JOIN 或視窗函數（例如 ROW_NUMBER() OVER
      (PARTITION BY ...)）時，NULL 值的分組行為、重複列的處理方式與原本的
      逐列相關子查詢不一定相同，且視窗函數的 PARTITION BY／ORDER BY 選擇本
      身就需要業務判斷。此類別本身就在
      app.yaml ai_gate.candidate_forbidden_complexity_flags 中被列為完全
      禁止自動改寫（連候選都不產生），比一般 advice_only 更嚴格。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: backend/app/config/app.yaml ai_gate.candidate_forbidden_complexity_flags

  - id: LATEST_ROW_CORRELATED_MAX
    name_zh_tw: 重複相關 MAX 子查詢取得最新紀錄
    model_guidance_zh_tw: >
      已確定同一來源出現多個相關 MAX scalar subquery。可提醒評估先集中取得最新日期／時間再 JOIN，
      但同日期同時間可能有多筆，未確認唯一性前不可把 ROW_NUMBER()=1 或其他完整改寫標成安全。
    category: subquery
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_SUBQUERY_UNNESTING]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [repeated_correlated_max_subquery]
    rationale_zh_tw: >
      牌照稅代表案例反覆以 MAX(UPDATE_DATE) 與 MAX(UPDATE_TIME) 的相關 scalar
      subquery 取得最新紀錄。集中計算最新紀錄可能減少重複邏輯，但若相同日期與
      時間存在多筆，改成 ROW_NUMBER()=1 會從多筆縮成一筆，查詢結果可能改變；
      因此此 pattern 只能提供方向，不能自動產生可採用改寫。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: docs/real-tax-sql-patterns.md#latest-row-correlated-max
      - type: internal
        ref: backend/app/services/optimization_patterns.py

  - id: REPEATED_SCALAR_AGGREGATE
    name_zh_tw: 同一來源重複 scalar aggregate 子查詢
    model_guidance_zh_tw: >
      已確定同一來源重複出現 scalar aggregate 子查詢。可提醒評估是否能先彙總一次再重用，
      但 GROUP BY、NULL、重複列與關聯條件都可能影響結果；不要直接合併或輸出可採用完整 SQL。
    category: subquery
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_VISIT_DATA_FEWER_TIMES]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [repeated_scalar_aggregate]
    rationale_zh_tw: >
      當同一來源被多次 scalar COUNT／SUM／MIN／MAX 查詢時，可能存在可集中計算
      的機會；但各子查詢的 filter、correlation、NULL 與 group semantics 必須逐項
      比對。SQLCheck 目前只確認「重複 aggregate 形狀」存在，不證明可合併。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: docs/real-tax-sql-patterns.md#repeated-scalar-aggregate
      - type: internal
        ref: backend/app/services/optimization_patterns.py

  - id: COMPOSITE_KEY_EXPRESSION_JOIN
    name_zh_tw: 複合代碼／欄位加工後再勾稽
    model_guidance_zh_tw: >
      已確定比較條件兩側來自不同資料表，且至少一側先做函數、串接或其他運算。
      應提醒優先確認是否能以原始欄位勾稽；欄位寬度、NULL、補空白與正確關聯鍵未知時不得猜改法。
    category: join
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [column_expression_join]
    rationale_zh_tw: >
      地價稅代表案例常見 SUBSTR(A.KEY,...)=B.KEY 或
      A.KEY=B.P1||B.P2 這類複合代碼勾稽。SQL 文字可以確認欄位先被加工再比較，
      但無法確認各段固定寬度、CHAR/VARCHAR2 補空白、NULL 規則及真正 business key，
      因此只能精準指出改善位置，不得自行拆欄或重組 JOIN。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: docs/real-tax-sql-patterns.md#composite-key-expression-join
      - type: internal
        ref: backend/app/services/optimization_patterns.py

  - id: REPEATED_SOURCE_UNION_BRANCH
    name_zh_tw: 相同來源重複 set-operation branch
    model_guidance_zh_tw: >
      已確定 UNION／UNION ALL 的多個 branch 使用相同來源資料表組合。
      可提醒評估是否能用 CASE、條件彙總或單次來源查詢整理，但不得把所有 UNION ALL 一概視為問題或直接合併。
    category: set_operation
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_VISIT_DATA_FEWER_TIMES]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [repeated_source_set_operation]
    rationale_zh_tw: >
      實務統計 SQL 有同一資料表因不同級距或分類條件而重複查詢的情況，可能適合
      改成 CASE／條件彙總；但 UNION ALL 也可能是正確的業務集合語意。detector
      只確認來源重複，不判斷 branch 是否互斥，也不證明合併後結果相同。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: docs/real-tax-sql-patterns.md#repeated-source-union-branch
      - type: internal
        ref: backend/app/services/optimization_patterns.py

  - id: DISTINCT_REMOVAL
    name_zh_tw: 移除 DISTINCT
    model_guidance_zh_tw: >
      只提供 advice_only：移除 DISTINCT 前必須確認重複列是否原本就是查詢語意的一部分，
      以及 JOIN 是否會產生重複資料；不可自動移除。
    category: distinct
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [distinct]
    rationale_zh_tw: >
      語意陷阱：DISTINCT 常用來掩蓋 JOIN 造成的重複列；在沒有證明 JOIN 後
      的資料已經唯一之前移除 DISTINCT，可能讓查詢回傳重複列，是結果集合的
      改變，不是單純效能調整。系統沒有資料唯一性的證明能力，因此只能提醒
      「請先確認 JOIN 後的資料是否已經唯一」，不能自動移除；
      ai_service._revalidate_suggested_sql 的 distinct 旗標比對也會擋下
      任何整段改寫把 DISTINCT 拿掉的結果。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_row_count
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization
      - type: internal
        ref: Handoff.md 2026-09-17 晚「advice_only 的說明改白話」

  - id: GROUP_BY_STRUCTURAL_REWRITE
    name_zh_tw: GROUP BY 欄位拆分／合併
    category: structure
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: prompt_heuristic_only
      family_signals:
        complexity_flags: [group_by_aggregate]
        qualifier_zh_tw: >
          group_by_aggregate 在有 GROUP BY 或彙總函數時就會命中，不能分辨
          分組鍵是否為欄位串接；系統提示硬性規則 6-1 點名禁止拆分／合併
          GROUP BY 欄位，但沒有確定性的偵測器。
    rationale_zh_tw: >
      例如把 GROUP BY a||b 拆成 GROUP BY a, b：拆分後分組鍵的排列組合可能與
      原本的字串串接分組不同（例如 a='1',b='23' 與 a='12',b='3' 串接後相同
      但分開後不同），是否等價需視實際資料值而定，系統無法只憑 SQL 文字證明。
      ai_service._revalidate_suggested_sql 的 group_by_count／having 比對也
      會擋下任何改變 GROUP BY 結構的整段改寫。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_runtime_improvement
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization

  - id: STRING_CONCAT_PREDICATE_SPLIT
    name_zh_tw: 欄位串接條件拆分為多欄位比對
    model_guidance_zh_tw: >
      已確定偵測到條件式使用欄位字串串接。應提醒先確認各欄位固定寬度、
      NULL 與補空白規則，再評估拆成原始欄位比對；資訊不足時不要猜切割位置或產生可採用 SQL。
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_TRANSFORMED_COLUMN]
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [string_concat_predicate]
    rationale_zh_tw: >
      例如 W.TAX_CD || W.SUBTAX_CD = '551' 改成分欄位比對時，'551' 要切成
      '55'+'1' 還是 '5'+'51' 需要業務確認欄位寬度慣例，系統無法從字面猜測
      正確的切法，只能在 example 中列出「若 TAX_CD 為 2 碼」這類假設，
      不能產生完整改寫。已在系統提示中以具體範例教導模型（見
      backend/app/prompts/sql_review_zh_tw.txt 範例 c）。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/prompts/sql_review_zh_tw.txt 範例 c

  - id: LEADING_WILDCARD_LIKE
    name_zh_tw: LIKE 前置萬用字元
    model_guidance_zh_tw: >
      R004 已確認為前置萬用字元。只能用白話提醒業務確認是否能縮小比對範圍；
      不要輸出替代 LIKE 片段或其他可直接貼上的 SQL。此 pattern 沒有可保證等價的
      自動改寫，也不可宣稱索引或執行計畫行為。
    category: predicate
    classification: ADVICE_ONLY
    oracle_applicable: true
    evidence_refs: [ORACLE11G_LEADING_WILDCARD_RANGE_LIMIT]
    detection:
      source: rule_engine
      rule_ids: [R004]
    rationale_zh_tw: >
      LIKE 樣式以 % 或 _ 開頭（前置萬用字元）時，沒有可以自動產生的等價改寫。
      常見的方向是「若業務上其實只需比對開頭，改成 LIKE 'xxx%'」，但這會改變
      查詢條件，需要業務確認，不是等價轉換；其他做法需依實際資料庫環境確認，
      索引相關建議屬 INDEX_ADVISORY（OUT_OF_SCOPE），不在本 pattern 提供。
      後置萬用字元不屬於 R004 的命中範圍；是否及如何改善仍需依實際資料庫環境
      確認。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - full_table_scan
      - execution_plan
      - create_index_recommendation
    verification:
      required_for_rewrite: true
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/config/rules.yaml R004
      - type: internal
        ref: backend/app/services/sql_parser.py::_leading_wildcard_literal
      - type: internal
        ref: "PR #2 third-party review round 2 item 3 (2026-09-18)"

  - id: CARTESIAN_JOIN_MISSING_CONDITION
    name_zh_tw: 缺少 JOIN 條件（實質笛卡兒積）
    model_guidance_zh_tw: >
      已偵測缺少 JOIN 條件的結構。應提醒確認是否為刻意的笛卡兒積；
      不要猜測或自行補上 JOIN 條件。
    category: join
    classification: ADVICE_ONLY
    oracle_applicable: true
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [cartesian_join]
    rationale_zh_tw: >
      缺少 JOIN 條件（含舊式逗號連接）通常是筆誤而非刻意設計，務必提醒；
      但正確的關聯鍵值需要業務知識才能補上，系統無法自動推測要用哪個欄位
      關聯，因此只能提醒評估，不能自動改寫。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - actual_row_count
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/services/sql_parser.py::_complexity_flags cartesian_join

  # ===========================================================================
  # Class C — INFORMATIONAL
  # ===========================================================================
  - id: SELECT_STAR
    name_zh_tw: SELECT * 使用星號
    model_guidance_zh_tw: >
      這是資訊性提醒：若業務只需要部分欄位，可建議明列欄位；
      不要宣稱一定能改善實際效能。
    category: structure
    classification: INFORMATIONAL
    oracle_applicable: true
    detection:
      source: sql_parser_complexity_flag
      complexity_flags: [select_star]
    rationale_zh_tw: >
      建議明列欄位是良好習慣（可讀性、避免未來欄位異動影響呼叫端），但
      SELECT * 本身既不代表 SQL 有錯，也不保證明列欄位就一定較快——實際影響
      取決於資料表欄位數與呼叫端實際使用哪些欄位，系統無法從 SQL 文字得知
      這些資訊。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - actual_runtime_improvement
      - index_usage
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization

  - id: IMPORTANT_TABLE_USAGE
    name_zh_tw: 查詢重要資料表
    model_guidance_zh_tw: >
      這是治理提醒，不是效能缺陷證據。依中心規範提醒重要資料表的查詢範圍、時段與測試環境要求，
      不要把它當成已確認的 SQL 改善點。
    category: table_usage
    classification: INFORMATIONAL
    oracle_applicable: true
    detection:
      source: rule_engine
      rule_ids: [R007]
    rationale_zh_tw: >
      命中 important_tables.yaml 清單只代表「這是治理上需要留意的資料表」，
      不代表這段 SQL 寫法有問題，也不是效能建議——這是資料範圍治理提醒，
      刻意與「SQL 寫法」類的 R004/R005/R006 提醒分開統計
      （見 ai_service._WRITE_STYLE_RULE_IDS 註解），不得因為外部 Skill 認為
      某寫法不佳，就把重要資料表提醒升級為「不符合中心規範」。
    allowed_behavior:
      explain: true
      advice: true
      automatic_rewrite: false
    prohibited_claims:
      - index_usage
      - execution_plan
      - full_table_scan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/config/important_tables.yaml

  - id: STRUCTURAL_COMPLEXITY_MANY_TABLES
    name_zh_tw: 關聯資料表數量偏多
    model_guidance_zh_tw: >
      這是結構複雜度提醒：關聯資料表較多時可建議逐段確認條件與必要性；
      沒有執行計畫或統計資訊時，不可推論實際效能或索引使用。
    category: structure
    classification: INFORMATIONAL
    oracle_applicable: true
    detection:
      source: improvement_score_structure
      structure_keys: [many_tables]
    rationale_zh_tw: >
      關聯的資料表數量多不必然代表查詢有問題或效能不佳，只是「寫法複雜度」
      的量化指標之一（improvement_score.py 的 S 分量），提醒審核者留意，
      不是可自動改善的具體項目。
    allowed_behavior:
      explain: true
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - actual_runtime_improvement
      - execution_plan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/config/rules.yaml improvement_score.structure.many_tables_threshold

  - id: LARGE_RESULT_SET_NO_LIMIT
    name_zh_tw: 可能回傳大量資料列
    category: structure
    classification: INFORMATIONAL
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      「這段查詢可能回傳很多列」是值得留意的一般提醒，但系統看不到實際資料
      量與資料分布，無法判斷「大量」的實際門檻，也不能宣稱一定有效能問題。
      目前沒有 sql_parser 偵測器；只能作為知識性提醒存在，不接自動觸發。
    allowed_behavior:
      explain: true
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - actual_row_count
      - execution_plan
      - full_table_scan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: external_skill
        ref: github/awesome-copilot/sql-optimization

  # ===========================================================================
  # Class D — OUT_OF_SCOPE (SQLCheck has no real Oracle optimizer context;
  # these must never be answered or estimated by Gemma — enforced today by
  # app.yaml ai_guard.forbidden_phrases and the prompt's 語氣與用詞紅線).
  # ===========================================================================
  - id: INDEX_ADVISORY
    name_zh_tw: 索引建議／存在／使用／涵蓋／欄位順序
    category: index
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      涵蓋 CREATE INDEX 建議、index existence、index usage、covering index、
      index column order。SQLCheck 沒有連線 Oracle Data Dictionary，看不到
      任何實際索引定義，因此不能建議建立、調整或宣稱使用了哪個索引；這類
      判斷需要 DBA 在測試環境對照實際執行計畫確認。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - index_not_used
      - index_used
      - index_invalid
      - create_index_recommendation
      - covering_index_recommendation
      - index_column_order_recommendation
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/prompts/sql_review_zh_tw.txt 「你完全沒有的能力」段落

  - id: EXECUTION_PLAN_CLAIM
    name_zh_tw: 執行計畫宣稱
    category: plan
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      SQLCheck 沒有連線資料庫，無法取得 EXPLAIN PLAN／實際執行計畫，任何
      「執行計畫顯示…」類敘述都是無法驗證的臆測。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - execution_plan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/config/app.yaml ai_guard.forbidden_phrases

  - id: FULL_TABLE_SCAN_CLAIM
    name_zh_tw: 全表掃描宣稱
    category: plan
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      「Full Table Scan／全表掃描」是實際執行計畫的觀測結果，SQLCheck 無法
      得知，任何宣稱都可能誤導使用者以為系統做過實際分析。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - full_table_scan
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/config/app.yaml ai_guard.forbidden_phrases

  - id: CARDINALITY_SELECTIVITY_DISTRIBUTION
    name_zh_tw: 基數／選擇率／資料分布／統計資訊
    category: statistics
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      涵蓋 cardinality、selectivity、data distribution、Oracle statistics。
      這些都是 Oracle optimizer 依實際資料統計出的量化資訊，SQLCheck 沒有
      連線資料庫、看不到 DBA_TABLES／DBA_TAB_COLUMNS 等統計資料，無法計算
      或引用，任何具體數字或「選擇率高／低」的宣稱都不可信。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - cardinality_estimate
      - selectivity_claim
      - data_distribution_claim
      - oracle_statistics_claim
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/prompts/sql_review_zh_tw.txt 「你完全沒有的能力」段落

  - id: ACTUAL_RUNTIME_IMPROVEMENT_CLAIM
    name_zh_tw: 實際執行效能改善量化宣稱
    category: plan
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      SQLCheck 從未實際執行 SQL，不能宣稱「已測試」「已驗證」「實測」某項
      改寫確實加快多少；`estimated_improvement_pct` 是模型主觀的粗略經驗
      法則參考值，僅供人工參考，不回灌「改善指數」或「改善潛力」，也不得在
      文字中包裝成量測結果。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - tested_claim
      - verified_claim
      - measured_runtime_claim
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/services/ai_service.py::improvement_potential

  - id: POST_REWRITE_ORACLE_COST_CLAIM
    name_zh_tw: 改寫後 Oracle COST 數字宣稱
    category: plan
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      COST 是 Oracle optimizer 依統計資訊估算出的數字，只有實際在資料庫執行
      估算才能得到；SQLCheck 不得捏造「改善後 COST」這種具體數值，這是 PRD
      明文禁止且已在 app.yaml ai_guard.forbidden_phrases 攔截的項目。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - post_rewrite_cost
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: backend/app/config/app.yaml ai_guard.forbidden_phrases

  - id: PARTITION_RECOMMENDATION
    name_zh_tw: 分割區（Partition）建議
    category: storage
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      資料表分割區策略是實體儲存設計，需要資料量、查詢模式與中央 DBA
      infrastructure context 才能決定，SQLCheck 是地方端 SQL 使用治理工具，
      不是中央 Oracle infrastructure DBA，不得建議分割區設計。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - partition_recommendation
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: skills/sqlcheck-oracle-review/references/project-boundaries.md

  - id: PHYSICAL_STORAGE_AND_HOST_TUNING
    name_zh_tw: 實體儲存調校／主機資源調校
    category: storage
    classification: OUT_OF_SCOPE
    oracle_applicable: true
    detection:
      source: none
    rationale_zh_tw: >
      涵蓋實體儲存參數調整與資料庫主機資源（記憶體、CPU、I/O）調校建議。
      這些屬於其他管理責任範圍，且需要中央 DBA 對正式環境的完整存取權限，
      SQLCheck 不連線資料庫、不具備這類 context，不得提出建議。
    allowed_behavior:
      explain: false
      advice: false
      automatic_rewrite: false
    prohibited_claims:
      - physical_storage_tuning
      - db_host_resource_tuning
    verification:
      required_for_rewrite: false
      mechanism: none
    sources:
      - type: internal
        ref: skills/sqlcheck-oracle-review/references/project-boundaries.md
