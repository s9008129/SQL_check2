# Single service (PRD §49) — no `ollama` service, no `db` service. Ollama
# runs natively on the Windows host and is reached via host.docker.internal.
services:
  sqlcheck:
    build: .
    image: sqlcheck-app:latest
    # This image only ever exists locally (built from `build: .` above). Without
    # this, any `docker compose run`/`up` that finds the image missing tries to
    # *pull* "sqlcheck-app" from Docker Hub first and fails with "pull access
    # denied" — observed on the first production deploy. `never` makes Compose
    # rely solely on the local build; deploy.ps1 builds explicitly before use.
    pull_policy: never
    container_name: sqlcheck-app
    ports:
      # host 443 -> container's single internal port (see Dockerfile).
      - "443:8000"
    volumes:
      # TLS cert/key produced by `python -m app.certgen` (deploy.ps1 runs
      # this on first deploy). Read-only: the app never writes here.
      - ./certs:/certs:ro
      # De-identified SQL archive (app/services/sql_archive.py, 2026-09-16).
      # Read-write, unlike ./certs above: the app appends JSON Lines files
      # here on every include_ai=true /api/analyze call. Survives container
      # rebuilds/removal since it lives on the host at ./data/sql_archive.
      - ./data:/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
